<ion-content [fullscreen]="true">

  <main class="login-page">

    <section class="login-card">

      <div class="brand-symbol">
        T
      </div>

      <h1>TaskTracker</h1>

      <p class="subtitle">
        Hesabına giriş yaparak görevlerine devam et.
      </p>

      <ion-item>

        <ion-label position="stacked">
          E-posta
        </ion-label>

        <ion-input
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="ornek@email.com"
          [(ngModel)]="email">
        </ion-input>

      </ion-item>

      <ion-item>

        <ion-label position="stacked">
          Şifre
        </ion-label>

        <ion-input
          type="password"
          autocomplete="current-password"
          placeholder="Şifrenizi girin"
          [(ngModel)]="password"
          (keyup.enter)="login()">
        </ion-input>

      </ion-item>

      <p
        class="error-message"
        *ngIf="errorMessage">

        {{ errorMessage }}

      </p>

      <ion-button
        expand="block"
        [disabled]="isLoading"
        (click)="login()">

        {{
          isLoading
            ? 'Giriş yapılıyor...'
            : 'Giriş Yap'
        }}

      </ion-button>

      <div class="register-link">

        <span>Henüz bir hesabın yok mu?</span>

        <button
          type="button"
          [disabled]="isLoading"
          (click)="goToRegister()">

          Kayıt Ol

        </button>

      </div>

    </section>

  </main>

</ion-content>
