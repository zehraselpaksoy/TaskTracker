services:
  minio:
    image: minio/minio:latest
    container_name: tasktracker-minio
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: tasktrackeradmin
      MINIO_ROOT_PASSWORD: TaskTracker123!

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

volumes:
  minio-data: